name: Tests

# Runs the test suite automatically on every push and pull request
# targeting main, so the test results show up as a badge/check
# without anyone having to remember to run pytest locally first.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run test suite
        run: pytest tests/ -v

      - name: Verify backend boots without hardware attached
        # This is the realistic CI environment: no Arduino is ever
        # plugged into a GitHub-hosted runner. The app should start
        # cleanly and serve the dashboard rather than crash, exactly
        # as it would for someone evaluating the repo without hardware
        # on hand yet.
        run: |
          cd backend
          python -c "
          from fastapi.testclient import TestClient
          import main

          with TestClient(main.app) as client:
              assert client.get('/').status_code == 200
              assert client.get('/api/employees').status_code == 200
              assert client.get('/api/device/status').json() == {'connected': False}
          print('Backend boots and serves correctly without hardware attached.')
          "
